<body>
<!-- IS-TAP: Регистрация и вход -->
<div id="auth-section" style="max-width:420px;margin:30px auto;padding:20px;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);font-family:Arial,sans-serif;">
  <h2 style="text-align:center;margin-bottom:20px;">IS-TAP</h2>

  <input id="auth-email" type="email" placeholder="Email"
    style="width:100%;padding:12px;margin-bottom:10px;border:1px solid #ddd;border-radius:8px;">

  <input id="auth-password" type="password" placeholder="Пароль"
    style="width:100%;padding:12px;margin-bottom:10px;border:1px solid #ddd;border-radius:8px;">

  <button onclick="registerUser()"
    style="width:100%;padding:12px;margin-bottom:10px;background:#1769ff;color:white;border:0;border-radius:8px;">
    Регистрация
  </button>

  <button onclick="loginUser()"
    style="width:100%;padding:12px;background:#333;color:white;border:0;border-radius:8px;">
    Войти
  </button>

  <p id="auth-message" style="text-align:center;margin-top:15px;"></p>
</div>

<script>
async function registerUser() {
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  const message = document.getElementById("auth-message");

  if (!email || !password) {
    message.textContent = "Введите email и пароль";
    return;
  }
// Отклик на вакансию
function apply(vacancyName) {
  alert("Вы выбрали вакансию: " + vacancyName);

  const message = document.getElementById("message");

  if (message) {
    message.textContent = "Отклик на вакансию «" + vacancyName + "» отправлен! ✅";
  }
}

// Поиск вакансий
function searchVacancies() {
  const input = document.getElementById("searchInput");
  const vacancies = document.querySelectorAll(".vacancy");

  if (!input) return;

  const searchText = input.value.toLowerCase().trim();

  vacancies.forEach(function(vacancy) {
    const text = vacancy.textContent.toLowerCase();

    if (text.includes(searchText)) {
      vacancy.style.display = "";
    } else {
      vacancy.style.display = "none";
    }
  });
}
  const { data, error } = await supabase.auth.signUp({
    email: email,
    password: password
  });

  if (error) {
    message.textContent = "Ошибка: " + error.message;
    return;
  }

  message.textContent = "Регистрация выполнена! Проверьте email.";
}

async function loginUser() {
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  const message = document.getElementById("auth-message");

  if (!email || !password) {
    message.textContent = "Введите email и пароль";
    return;
  }

  const { data, error } = await supabase.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    message.textContent = "Ошибка входа: " + error.message;
    return;
  }

  message.textContent = "Вы успешно вошли в IS-TAP! 🎉";
}
</script>
<header>
  <h1>IS-TAP</h1>
  <p>Найди работу рядом с собой</p>
</header>

<main class="container">

  <section class="search">
    <input
      type="search"
      id="searchInput"
      placeholder="🔎 Поиск вакансии..."
      aria-label="Поиск вакансии"
      oninput="searchVacancies()"
    >
    <button type="button" onclick="searchVacancies()">Найти работу</button>
  </section>

  <section id="vacancies" aria-label="Вакансии">

    <article class="vacancy">
      <h2>Промоутер</h2>
      <p>📍 Ашхабад</p>
      <p class="salary">💰 Зарплата: договорная</p>
      <button type="button" onclick="apply('Промоутер')">Откликнуться</button>
    </article>

    <article class="vacancy">
      <h2>Онлайн-оператор</h2>
      <p>🌐 Удалённая работа</p>
      <p class="salary">💰 Зарплата: от 1500 TMT</p>
      <button type="button" onclick="apply('Онлайн-оператор')">Откликнуться</button>
    </article>

    <article class="vacancy">
      <h2>Менеджер</h2>
      <p>📍 Ашхабад</p>
      <p class="salary">💰 Зарплата: от 2000 TMT</p>
      <button type="button" onclick="apply('Менеджер')">Откликнуться</button>
    </article>

  </section>

  <div id="empty" class="empty">
    😔 Вакансии не найдены.
  </div>

</main>

<nav aria-label="Навигация">
  <button type="button" onclick="location.reload()">🏠 Главная</button>
  <button type="button" onclick="showProfile()">👤 Профиль</button>
  <button type="button" onclick="addVacancy()">➕ Добавить</button>
</nav>

<script>
  function apply(job) {
    alert("Отклик на вакансию: " + job);
  }

  function searchVacancies() {
    const input = document.getElementById("searchInput");
    const text = input.value.trim().toLowerCase();
    const cards = document.querySelectorAll(".vacancy");
    let found = 0;

    cards.forEach(card => {
      const matches = card.innerText.toLowerCase().includes(text);
      card.style.display = matches ? "block" : "none";

      if (matches) {
        found++;
      }
    });

    document.getElementById("empty").style.display =
      found === 0 ? "block" : "none";
  }

  async function showProfile() {
  const { data, error } = await supabase.auth.getUser();

  if (error || !data.user) {
    alert("Сначала войдите в аккаунт.");
    return;
  }

  const user = data.user;

  const oldProfile = document.getElementById("profile-screen");
  if (oldProfile) oldProfile.remove();

  const profile = document.createElement("div");
  profile.id = "profile-screen";

  profile.innerHTML = `
    <div style="
      position:fixed;
      inset:0;
      background:#f5f7fb;
      z-index:10000;
      overflow:auto;
      padding:20px;
    ">

      <div style="
        max-width:600px;
        margin:20px auto;
      ">

        <div style="
          background:#1769ff;
          color:white;
          padding:30px 20px;
          border-radius:20px;
          text-align:center;
          margin-bottom:20px;
        ">
          <div style="font-size:60px;">👤</div>
          <h1 style="margin:10px 0;">Мой профиль</h1>
          <p style="font-size:16px;">
            IS-TAP
          </p>
        </div>

        <div style="
          background:white;
          border-radius:18px;
          padding:20px;
          box-shadow:0 4px 15px rgba(0,0,0,.08);
          margin-bottom:20px;
        ">

          <h2 style="margin-bottom:18px;">
            👤 Данные аккаунта
          </h2>

          <p style="
            color:#667085;
            margin-bottom:8px;
          ">
            Email
          </p>

          <div style="
            background:#f5f7fb;
            padding:14px;
            border-radius:10px;
            margin-bottom:20px;
            word-break:break-word;
          ">
            ${escapeHtml(user.email || "")}
          </div>

          <p style="
            color:#667085;
            margin-bottom:8px;
          ">
            Статус
          </p>

          <div style="
            background:#e8f5e9;
            color:#2e7d32;
            padding:14px;
            border-radius:10px;
          ">
            ✅ Вы вошли в аккаунт
          </div>

        </div>

        <button
          onclick="logoutUser()"
          style="
            width:100%;
            padding:15px;
            background:#d32f2f;
            color:white;
            border:0;
            border-radius:12px;
            font-size:16px;
            font-weight:bold;
            margin-bottom:12px;
          "
        >
          🚪 Выйти из аккаунта
        </button>

        <button
          onclick="document.getElementById('profile-screen').remove()"
          style="
            width:100%;
            padding:15px;
            background:#ddd;
            color:#222;
            border:0;
            border-radius:12px;
            font-size:16px;
            font-weight:bold;
          "
        >
          ← Назад
        </button>

      </div>
    </div>
  `;

  document.body.appendChild(profile);
}


async function logoutUser() {
  const { error } = await supabase.auth.signOut();

  if (error) {
    alert("Ошибка выхода: " + error.message);
    return;
  }

  const profile = document.getElementById("profile-screen");
  if (profile) profile.remove();

  alert("Вы вышли из аккаунта.");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}
 
function addVacancy() {
  const oldForm = document.getElementById("add-vacancy-form");
  if (oldForm) oldForm.remove();

  const form = document.createElement("div");
  form.id = "add-vacancy-form";

  form.innerHTML = `
    <div style="
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.5);
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    ">
      <div style="
        background:white;
        width:100%;
        max-width:500px;
        max-height:90vh;
        overflow:auto;
        border-radius:20px;
        padding:22px;
      ">
        <h2 style="margin-bottom:18px;">➕ Добавить вакансию</h2>

        <input id="vac-title"
          placeholder="Название вакансии"
          style="width:100%;padding:14px;margin-bottom:10px;">

        <input id="vac-company"
          placeholder="Название компании"
          style="width:100%;padding:14px;margin-bottom:10px;">

        <input id="vac-location"
          placeholder="📍 Город или место работы"
          style="width:100%;padding:14px;margin-bottom:10px;">

        <input id="vac-salary"
          placeholder="💰 Зарплата"
          style="width:100%;padding:14px;margin-bottom:10px;">

        <textarea id="vac-description"
          placeholder="📝 Описание вакансии"
          style="width:100%;padding:14px;margin-bottom:15px;min-height:120px;resize:vertical;"></textarea>

        <button onclick="saveVacancy()"
          style="width:100%;padding:14px;margin-bottom:10px;background:#1769ff;color:white;border:0;border-radius:10px;font-weight:bold;">
          💾 Опубликовать
        </button>

        <button onclick="document.getElementById('add-vacancy-form').remove()"
          style="width:100%;padding:14px;background:#ddd;color:#222;border:0;border-radius:10px;">
          Отмена
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(form);
}


async function saveVacancy() {
  const title = document.getElementById("vac-title").value.trim();
  const company = document.getElementById("vac-company").value.trim();
  const location = document.getElementById("vac-location").value.trim();
  const salary = document.getElementById("vac-salary").value.trim();
  const description = document.getElementById("vac-description").value.trim();

  if (!title || !company || !location) {
    alert("Заполни название вакансии, компанию и город.");
    return;
  }

  try {
    const { data: { user } } = await supabase.auth.getUser();

    if (!user) {
      alert("Сначала войди в аккаунт.");
      return;
    }

    const { error } = await supabase
      .from("vacancies")
      .insert([{
        title: title,
        company: company,
        location: location,
        salary: salary,
        description: description,
        user_id: user.id
      }]);

    if (error) {
      console.error(error);
      alert("Ошибка сохранения: " + error.message);
      return;
    }

    alert("✅ Вакансия опубликована!");

    document.getElementById("add-vacancy-form").remove();

    loadVacancies();

  } catch (error) {
    console.error(error);
    alert("Произошла ошибка при сохранении.");
  }
}
  async function loadVacancies() {
  const container = document.getElementById("vacancies");

  try {
    const { data, error } = await supabase
      .from("vacancies")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);
      return;
    }

    container.innerHTML = "";

    if (!data || data.length === 0) {
      container.innerHTML = `
        <div class="empty" style="display:block;">
          Пока вакансий нет.
        </div>
      `;
      return;
    }

    data.forEach(vacancy => {
      const card = document.createElement("article");
      card.className = "vacancy";

      card.innerHTML = `
        <h2>${escapeHtml(vacancy.title || "")}</h2>
        <p>🏢 ${escapeHtml(vacancy.company || "")}</p>
        <p>📍 ${escapeHtml(vacancy.location || "")}</p>
        <p class="salary">💰 ${escapeHtml(vacancy.salary || "По договорённости")}</p>
        <p>${escapeHtml(vacancy.description || "")}</p>
      <button type="button" onclick="apply('${escapeHtml(vacancy.title || "")}')">
  Откликнуться
</button>
`;
      container.appendChild(card);
    });

  } catch (error) {
    console.error(error);
  }
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

window.addEventListener("load", loadVacancies);
  
</script>

</body>
